name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    env:
      # Dummy: prisma generate y los tests unitarios no conectan a la BD
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  # Todo lo que necesita una base **de verdad**: migraciones, seed y los tests
  # de integración. Comparten job para no levantar dos veces el mismo Postgres.
  database:
    name: Base de datos (migraciones + integración)
    runs-on: ubuntu-latest
    # Postgres de verdad y descartable: las comprobaciones de abajo no se pueden
    # hacer sin una base, y nunca deben correr contra la de producción.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: golazo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/golazo_ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Desde Prisma 7 (B5d) el cliente **no** se genera solo al instalar: sale
      # a `lib/generated/` (ignorado en git) y ningún paquete de Prisma trae ya
      # un `postinstall`. Sin este paso el seed de abajo no encuentra qué
      # importar. `migrate deploy` no lo necesita, pero el seed sí.
      - name: Generar Prisma Client
        run: npx prisma generate

      # 1) ¿Las migraciones aplican desde cero? Importa especialmente porque
      #    varias de este repo están escritas a mano (la de identidad global del
      #    jugador, entre otras): un SQL inválido o fuera de orden no se nota
      #    hasta que alguien levanta el proyecto de cero o se despliega.
      - name: Aplicar migraciones sobre una base limpia
        run: npx prisma migrate deploy

      # 2) ¿Quedó algo del schema sin migrar? Es el error clásico: se toca
      #    `schema.prisma`, se corre `prisma generate` o `db push`, y el archivo
      #    de migración nunca se crea. En local anda —la BD de desarrollo ya
      #    tiene el cambio— y explota al desplegar. `--exit-code` devuelve 2 si
      #    hay diferencia, y eso hace fallar el job.
      #
      #    Los flags cambiaron en Prisma 7 (B5d): `--from-schema-datasource` y
      #    `--to-schema-datamodel` se eliminaron. Ahora el datasource sale de
      #    `prisma.config.ts` (la `url` ya no vive en el schema) y el modelo se
      #    pasa con `--to-schema`.
      - name: Verificar que no falten migraciones (drift)
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      # 3) El seed tiene que seguir corriendo: es idempotente y lo usan tanto una
      #    instalación nueva como `npm run db:reset`.
      - name: Correr el seed
        run: npm run db:seed

      # 4) Los tests de integración (#26): lo único del repo que ejecuta queries
      #    reales. Los 314 tests unitarios son de lógica pura, así que un `where`
      #    que deja de filtrar, un `select` mal armado o un cambio de motor de
      #    Prisma pasan verdes sin esto.
      #
      #    Va al final a propósito: truncan todas las tablas entre casos, así que
      #    después de este paso la base queda vacía —y el seed de arriba ya se
      #    verificó—.
      #
      #    `TEST_DATABASE_URL` explícita hace que, si la base no responde, los
      #    tests **fallen en vez de saltearse**: sin eso el job daría verde sin
      #    haber corrido nada, que es justo lo que este paso viene a evitar.
      - name: Tests de integración
        env:
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/golazo_ci"
        run: npm run test:integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Bloqueante desde 2026-07-22: los ~26 errores preexistentes que
      # justificaban el `continue-on-error` ya se limpiaron. Quedan solo
      # warnings (casi todos `<img>` vs `next/image`, deuda de M2).
      #
      # `npm run lint` y no una lista de carpetas a mano: el script es `eslint .`
      # y la lista de acá se había quedado corta —`tests/`, `scripts/` y los
      # archivos de config de la raíz no se linteaban en CI—, así que un error
      # ahí pasaba igual. Una sola forma de correr el lint, local y en CI.
      - name: ESLint
        run: npm run lint

  # End-to-end con Playwright (A8): el navegador contra la app compilada.
  #
  # **Apagado por defecto.** No es una decisión de comodidad: la app no arranca
  # sin claves de Clerk —el `ClerkProvider` es parte del layout raíz— así que
  # este job no puede correr en un fork ni en un repo recién clonado. Se
  # enciende poniendo la variable `E2E_ENABLED=true` en Settings → Variables y
  # cargando los secretos de abajo. Mientras esté apagado el job se saltea
  # entero: no da un verde falso, directamente no aparece como ejecutado.
  #
  # Para encenderlo hacen falta:
  #   vars.E2E_ENABLED                          = "true"
  #   secrets.CLERK_PUBLISHABLE_KEY / CLERK_SECRET_KEY
  #   secrets.E2E_CLERK_USER_EMAIL / E2E_CLERK_USER_PASSWORD  (cuenta de pruebas,
  #     OWNER de una organización — sin ella el flujo del panel se saltea)
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    if: vars.E2E_ENABLED == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: golazo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Base descartable: el flujo del organizador **escribe** (crea torneo,
      # inscribe equipos, carga un resultado). Nunca contra la real.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/golazo_e2e"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      # Misma regla que los tests de integración (#29): si el job está
      # encendido, que los flujos con sesión se salteen en silencio sería un
      # verde que no probó nada. Con esto, faltar la cuenta es un error.
      E2E_REQUIRE_AUTH: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Preparar la base
        run: |
          npx prisma migrate deploy
          npm run db:seed

      # Solo Chromium: alcanza para lo que estos tests verifican (render,
      # redirecciones, formularios) y bajar tres navegadores en cada corrida
      # cuesta minutos que no compran nada.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # `CI=true` hace que Playwright levante el **build de producción** en vez
      # de `next dev` (ver playwright.config.ts): es lo que se despliega, y
      # además evita el compilado por ruta que hace lentos a estos tests.
      - name: Tests E2E
        run: npm run test:e2e

      - name: Guardar el reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
